<h2 class="toolbox__title">Select, what you want to see on guitar neck.</h2>

<div class="toolbox__mode-selector">
  <button type="button"
          class="toolbox__mode-btn"
          [class.toolbox__mode-btn--active]="!showCustomPattern"
          (click)="showCustomPattern = false">
    Standard Patterns
  </button>
  <button type="button"
          class="toolbox__mode-btn"
          [class.toolbox__mode-btn--active]="showCustomPattern"
          (click)="showCustomPattern = true">
    Custom Pattern
  </button>
</div>

<!-- range-toolbar -->
<section class="range-card">
  <div class="range-card__title">Fret Range</div>

  <div class="range-toolbar">
    <button
      *ngFor="let preset of rangePresets"
      type="button"
      class="range-preset"
      [class.range-preset--active]="activePreset === preset.id"
      (click)="selectPreset(preset.id)">
      <span class="range-preset__icon">{{ preset.icon }}</span>
      <span class="range-preset__label">{{ preset.label }}</span>
      <span class="range-preset__value">{{ preset.start }} – {{ preset.end }}</span>
    </button>

    <button
      type="button"
      class="range-preset"
      [class.range-preset--active]="activePreset === 'custom'"
      (click)="activePreset = 'custom'">
      <span class="range-preset__icon">⚙️</span>
      <span class="range-preset__label">Custom</span>
      <span class="range-preset__value">&nbsp;</span>
    </button>

    <div class="range-custom" *ngIf="activePreset === 'custom'">
      <input
        class="form-control range-custom__input"
        type="number"
        [(ngModel)]="customStart"
        [ngModelOptions]="{standalone: true}"
        min="0"
        max="24" />
      <span class="range-custom__separator">–</span>
      <input
        class="form-control range-custom__input"
        type="number"
        [(ngModel)]="customEnd"
        [ngModelOptions]="{standalone: true}"
        min="0"
        max="24" />
      <button
        class="btn btn-success range-custom__button"
        type="button"
        (click)="applyCustomRange()">
        Show
      </button>
    </div>
  </div>
</section>

<form *ngIf="!showCustomPattern"
      [formGroup]="guitarForm"
      (ngSubmit)="onSubmit()"
      class="toolbox__form">
  <div class="toolbox__field">
    <label class="toolbox__label" for="elementType">Type:</label>
    <select class="toolbox__select" id="elementType" formControlName="elementType">
      <option *ngFor="let type of elementTypes" [value]="type.id">{{type.name}}</option>
    </select>
  </div>

  <div class="toolbox__field">
    <label class="toolbox__label" for="pattern">Pattern:</label>
    <select class="toolbox__select" id="pattern" formControlName="pattern">
      <option *ngFor="let pattern of availablePatterns" [value]="pattern">{{pattern}}</option>
    </select>
  </div>

  <div class="toolbox__field">
    <label class="toolbox__label" for="key">Key of:</label>
    <select class="toolbox__select" id="key" formControlName="key">
      <option *ngFor="let key of keys" [value]="key">{{key}}</option>
    </select>
  </div>

  <button type="submit" class="toolbox__submit">Show!</button>
</form>

<lib-custom-pattern
  *ngIf="showCustomPattern"
  (onCustomPatternSubmit)="onCustomPatternSubmit($event)">
</lib-custom-pattern>
